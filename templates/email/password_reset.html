{# subject: 重置你的密码 #}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>重置你的密码</title>
</head>
<body style="margin:0;padding:24px;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;">
    <tr>
      <td style="padding:28px 32px;">
        <p style="margin:0 0 8px;font-size:13px;color:#6e6e73;">{{ app_name }}</p>
        <h1 style="margin:0 0 16px;font-size:22px;">重置密码</h1>
        <p style="margin:0 0 12px;line-height:1.6;">你好{% if username %}，{{ username }}{% endif %}。我们收到了重置密码的请求。</p>
        <p style="margin:0 0 20px;line-height:1.6;">这是教学演示：<strong>不会真的改密码</strong>。完整的「忘记密码」流程（校验 token、更新哈希、作废旧 token）仍是可选作业。</p>
        <p style="margin:0 0 24px;">
          <a href="{{ reset_url }}" style="display:inline-block;padding:10px 18px;background:#b45309;color:#ffffff;text-decoration:none;border-radius:8px;">重置密码（演示链接）</a>
        </p>
        <p style="margin:0;font-size:12px;color:#6e6e73;">
          如果不是你本人操作，忽略这封邮件即可。<br>
          演示 token：{{ token }}<br>
          {{ reset_url }}
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
