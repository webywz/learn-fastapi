{# subject: 请验证你的邮箱 #}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>请验证你的邮箱</title>
</head>
<body style="margin:0;padding:24px;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;">
    <tr>
      <td style="padding:28px 32px;">
        <p style="margin:0 0 8px;font-size:13px;color:#6e6e73;">{{ app_name }}</p>
        <h1 style="margin:0 0 16px;font-size:22px;">验证邮箱</h1>
        <p style="margin:0 0 12px;line-height:1.6;">你好，{{ username }}。请确认 <strong>{{ token }}</strong> 对应的邮箱属于你。</p>
        <p style="margin:0 0 20px;line-height:1.6;">这是教学演示：接口不会改数据库里的用户状态，只演示「验证邮件长什么样」。完整的邮箱验证流程（写库、过期、一次性 token）仍是可选作业。</p>
        <p style="margin:0 0 24px;">
          <a href="{{ verify_url }}" style="display:inline-block;padding:10px 18px;background:#047857;color:#ffffff;text-decoration:none;border-radius:8px;">验证邮箱</a>
        </p>
        <p style="margin:0;font-size:12px;color:#6e6e73;">链接 24 小时后应失效（生产环境请把 token 存 Redis / 数据表，而不是写死在邮件里）。<br>{{ verify_url }}</p>
      </td>
    </tr>
  </table>
</body>
</html>
